<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GINGA - Dark Theme</title>
    <style>
        body {
            background-color: #121212; /* Dark background */
            color: #e0e0e0; /* Light text */
            font-family: Arial, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease; /* Smooth animations */
        }
        a {
            color: cyan; /* Cyan accents for links */
            transition: color 0.3s ease;
        }
        a:hover {
            color: #00ffff; /* Lighter cyan on hover */
        }
        .brand {
            font-size: 2em;
            color: cyan; /* GINGA branding */
            font-weight: bold;
            text-align: center;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="brand">GINGA</div>
    <h1>Welcome to GINGA</h1>
    <p>This is a sample website featuring a dark theme and smooth animations.</p>
    <a href="#">Learn more</a>
</body>
</html>
