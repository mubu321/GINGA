<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GINGA - 動画配信プラットフォーム</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-dark: #0a0e27;
            --bg-darker: #050810;
            --bg-card: #1a1f3a;
            --cyan: #00d9ff;
            --cyan-light: #4df4ff;
            --cyan-dark: #0099cc;
            --text-primary: #e0e0ff;
            --text-secondary: #a0a0c0;
            --border: #2a3050;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--bg-darker) 0%, var(--bg-dark) 100%);
            color: var(--text-primary);
            min-height: 100vh;
        }
        
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 30px;
            background: rgba(5, 8, 16, 0.8);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .logo {
            font-size: 28px;
            font-weight: 900;
            text-decoration: none;
            background: linear-gradient(135deg, var(--cyan) 0%, var(--cyan-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .logo::before {
            content: "◆";
            font-size: 24px;
            color: var(--cyan);
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .nav-link {
            text-decoration: none;
            color: var(--text-primary);
            font-weight: 600;
            font-size: 14px;
            padding: 8px 16px;
            border-radius: 6px;
            transition: all 0.3s ease;
        }
        
        .nav-link:hover {
            background: rgba(0, 217, 255, 0.1);
            color: var(--cyan-light);
        }
        
        .u-icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid var(--cyan);
            transition: all 0.3s ease;
        }
        
        .u-icon-btn:hover {
            border-color: var(--cyan-light);
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.3);
        }
        
        .login-btn {
            background: linear-gradient(135deg, var(--cyan) 0%, var(--cyan-light) 100%);
            color: var(--bg-dark);
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 217, 255, 0.4);
        }
        
        /* モーダル */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        
        .modal-window {
            background: var(--bg-card);
            padding: 40px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            position: relative;
        }
        
        .logout-link {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            text-decoration: underline;
            background: none;
            border: none;
            padding: 0;
            transition: color 0.3s ease;
        }
        
        .logout-link:hover {
            color: #ff6b6b;
        }
        
        .modal-window h2 {
            margin: 0 0 25px;
            font-size: 22px;
            color: var(--cyan-light);
        }
        
        .input-box {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid var(--border);
            background: rgba(0, 217, 255, 0.05);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .input-box:focus {
            outline: none;
            border-color: var(--cyan);
            box-shadow: 0 0 10px rgba(0, 217, 255, 0.2);
        }
        
        .file-label {
            display: block;
            background: rgba(0, 217, 255, 0.15);
            color: var(--cyan);
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }
        
        .file-label:hover {
            background: rgba(0, 217, 255, 0.25);
            border-color: var(--cyan);
        }
        
        #editIcon { display: none; }
        
        .warn-text {
            color: #ff9999;
            font-size: 12px;
            margin-bottom: 15px;
            font-weight: 500;
            line-height: 1.5;
        }
        
        .btn-save {
            background: linear-gradient(135deg, var(--cyan) 0%, var(--cyan-light) 100%);
            color: var(--bg-dark);
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 217, 255, 0.4);
        }
        
        .btn-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            margin-top: 15px;
            font-size: 13px;
            text-decoration: underline;
            transition: color 0.3s ease;
        }
        
        .btn-close:hover {
            color: var(--text-primary);
        }
        
        /* 動画グリッド */
        .v-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            padding: 30px;
            max-width: 1600px;
            margin: 0 auto;
        }
        
        .v-card {
            text-decoration: none;
            color: var(--text-primary);
            font-size: 14px;
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .v-card:hover {
            transform: translateY(-5px);
        }
        
        .thumb-container {
            width: 100%;
            aspect-ratio: 16/9;
            background: rgba(0, 217, 255, 0.1);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }
        
        .thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        
        .thumb.loaded {
            opacity: 1;
        }
        
        .v-title {
            font-weight: 700;
            margin-top: 12px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 15px;
        }
        
        .v-stats {
            color: var(--text-secondary);
            font-size: 12px;
            margin-top: 6px;
        }
        
        @media (max-width: 768px) {
            header {
                padding: 12px 15px;
            }
            
            .logo {
                font-size: 20px;
            }
            
            .v-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 12px;
                padding: 15px;
            }
        }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="logo">GINGA</a>
    <div class="header-right">
        <a href="upload.html" class="nav-link">+ 投稿</a>
        <div id="userArea"></div>
    </div>
</header>

<div id="profileModal" class="modal-overlay">
    <div class="modal-window">
        <button class="logout-link" id="doLogout">ログアウト</button>
        <h2>プロフィール編集</h2>
        <input type="text" id="editName" class="input-box" placeholder="ユーザー名">
        <label for="editIcon" class="file-label">🖼️ プロフィール画像を選択</label>
        <input type="file" id="editIcon" accept="image/*">
        <p class="warn-text">※ なるべく小さいサイズの画像をお選びください（1MB以下推奨）</p>
        <button class="btn-save" id="saveProfile">変更を保存</button>
        <button class="btn-close" id="closeModal">キャンセル</button>
    </div>
</div>

<div class="v-grid" id="grid"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, query, onSnapshot, orderBy, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAZivYKOGc1tSUAIDq_c10C1wJ-Pdh0U2o",
        authDomain: "mytube-f4544.firebaseapp.com",
        projectId: "mytube-f4544",
        storageBucket: "mytube-f4544.firebasestorage.app",
        messagingSenderId: "655444283107",
        appId: "1:655444283107:web:04f9173faf2d951790ffd6"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let currentUser = null;

    onAuthStateChanged(auth, async user => {
        currentUser = user;
        const userArea = document.getElementById('userArea');
        if (user) {
            const uSnap = await getDoc(doc(db, "users", user.uid));
            const ud = uSnap.data();
            userArea.innerHTML = `<img src="${ud?.icon || ''}" class="u-icon-btn" id="openModalBtn" title="プロフィール">`;
            document.getElementById('openModalBtn').onclick = () => {
                document.getElementById('editName').value = ud?.name || "";
                document.getElementById('profileModal').style.display = 'flex';
            };
        } else {
            userArea.innerHTML = `<a href="login.html" class="login-btn">ログイン</a>`;
        }
    });

    document.getElementById('doLogout').onclick = () => {
        if (confirm("ログアウトしてもよろしいですか？")) {
            signOut(auth).then(() => location.reload());
        }
    };

    document.getElementById('closeModal').onclick = () => {
        document.getElementById('profileModal').style.display = 'none';
    };

    document.getElementById('saveProfile').onclick = async () => {
        if (!currentUser) return;
        const btn = document.getElementById('saveProfile');
        btn.innerText = "保存中...";
        btn.disabled = true;
        const newName = document.getElementById('editName').value;
        const fileInput = document.getElementById('editIcon');
        const updates = { name: newName };

        if (fileInput.files[0]) {
            const reader = new FileReader();
            reader.onload = async (e) => {
                updates.icon = e.target.result;
                await updateDoc(doc(db, "users", currentUser.uid), updates);
                location.reload();
            };
            reader.readAsDataURL(fileInput.files[0]);
        } else {
            await updateDoc(doc(db, "users", currentUser.uid), updates);
            location.reload();
        }
    };

    onSnapshot(query(collection(db, "videos"), orderBy("createdAt", "desc")), snap => {
        const grid = document.getElementById('grid');
        grid.innerHTML = "";
        snap.forEach(vDoc => {
            const v = vDoc.data();
            const tid = `thumb-${vDoc.id}`;
            grid.innerHTML += `
                <a href="watch.html?id=${vDoc.id}" class="v-card">
                    <div class="thumb-container">
                        <img src="" id="${tid}" class="thumb">
                    </div>
                    <div class="v-title">${v.title}</div>
                    <div class="v-stats">${(v.views || 0).toLocaleString()}回視聴</div>
                </a>
            `;
            setTimeout(() => {
                const img = document.getElementById(tid);
                if (v.thumbnail) {
                    img.src = v.thumbnail;
                    img.classList.add('loaded');
                } else {
                    generateThumb(v.url, img);
                }
            }, 100);
        });
    });

    function generateThumb(url, imgElement) {
        const v = document.createElement('video');
        v.src = url;
        v.preload = "metadata";
        v.muted = true;
        v.crossOrigin = "anonymous";
        v.playsInline = true;
        v.onloadedmetadata = () => { v.currentTime = 1.0; };
        v.onseeked = () => {
            const c = document.createElement('canvas');
            c.width = 320;
            c.height = 180;
            c.getContext('2d').drawImage(v, 0, 0, 320, 180);
            imgElement.src = c.toDataURL('image/jpeg', 0.8);
            imgElement.classList.add('loaded');
            v.removeAttribute('src');
            v.load();
            v.remove();
        };
        v.onerror = () => { v.remove(); };
    }
</script>
</body>
</html>
