<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GINGA - 動画配信プラットフォーム</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-dark: #0a0e27;
            --bg-darker: #050810;
            --bg-card: #1a1f3a;
            --cyan: #00d9ff;
            --cyan-light: #4df4ff;
            --cyan-dark: #0099cc;
            --text-primary: #e0e0ff;
            --text-secondary: #a0a0c0;
            --border: #2a3050;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--bg-darker) 0%, var(--bg-dark) 100%);
            color: var(--text-primary);
            min-height: 100vh;
        }
        
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: rgba(5, 8, 16, 0.9);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .logo {
            font-size: 24px;
            font-weight: 900;
            text-decoration: none;
            background: linear-gradient(135deg, var(--cyan) 0%, var(--cyan-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .logo::before {
            content: "◆";
            font-size: 20px;
            color: var(--cyan);
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .nav-link {
            text-decoration: none;
            color: var(--text-primary);
            font-weight: 600;
            font-size: 13px;
            padding: 8px 12px;
            border-radius: 6px;
            transition: all 0.3s ease;
        }
        
        .nav-link:hover {
            background: rgba(0, 217, 255, 0.1);
            color: var(--cyan-light);
        }
        
        /* 動画グリッド */
        .v-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            padding: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }
        
        .v-card {
            text-decoration: none;
            color: var(--text-primary);
            font-size: 13px;
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .v-card:hover {
            transform: translateY(-5px);
        }
        
        .thumb-container {
            width: 100%;
            aspect-ratio: 16/9;
            background: rgba(0, 217, 255, 0.1);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }
        
        .thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        
        .thumb.loaded {
            opacity: 1;
        }
        
        .v-title {
            font-weight: 700;
            margin-top: 10px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 14px;
            line-height: 1.3;
        }
        
        .v-stats {
            color: var(--text-secondary);
            font-size: 11px;
            margin-top: 5px;
        }
        
        /* ローディング */
        #loadingIndicator {
            text-align: center;
            padding: 30px 20px;
            color: var(--text-secondary);
            font-size: 13px;
            display: none;
        }
        
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-top: 2px solid var(--cyan);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 1024px) {
            .v-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 12px;
                padding: 15px;
            }
        }
        
        @media (max-width: 768px) {
            header {
                padding: 10px 15px;
            }
            
            .logo {
                font-size: 20px;
            }
            
            .nav-link {
                font-size: 12px;
                padding: 6px 10px;
            }
            
            .v-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 10px;
                padding: 12px;
            }
        }
        
        @media (max-width: 480px) {
            header {
                padding: 8px 12px;
            }
            
            .logo {
                font-size: 18px;
            }
            
            .logo::before {
                font-size: 16px;
                margin-right: 4px;
            }
            
            .nav-link {
                font-size: 11px;
                padding: 6px 8px;
            }
            
            .v-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
                padding: 8px;
            }
            
            .v-title {
                font-size: 12px;
                margin-top: 8px;
            }
            
            .v-stats {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="logo">GINGA</a>
    <div class="header-right">
        <a href="upload.html" class="nav-link">+ 投稿</a>
    </div>
</header>

<div class="v-grid" id="grid"></div>
<div id="loadingIndicator">
    <div class="spinner"></div>
    <span>読み込み中...</span>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, query, orderBy, startAfter, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAZivYKOGc1tSUAIDq_c10C1wJ-Pdh0U2o",
        authDomain: "mytube-f4544.firebaseapp.com",
        projectId: "mytube-f4544",
        storageBucket: "mytube-f4544.firebasestorage.app",
        messagingSenderId: "655444283107",
        appId: "1:655444283107:web:04f9173faf2d951790ffd6"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let lastVisible = null;
    let isLoading = false;
    let hasMore = true;
    const BATCH_SIZE = 12;

    // 初回読み込み
    loadMoreVideos();

    // 無限スクロール検出
    window.addEventListener('scroll', () => {
        if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) {
            if (!isLoading && hasMore) {
                loadMoreVideos();
            }
        }
    });

    async function loadMoreVideos() {
        if (isLoading) return;
        isLoading = true;
        document.getElementById('loadingIndicator').style.display = 'block';

        try {
            let q;
            if (lastVisible === null) {
                q = query(collection(db, "videos"), orderBy("createdAt", "desc"), limit(BATCH_SIZE + 1));
            } else {
                q = query(collection(db, "videos"), orderBy("createdAt", "desc"), startAfter(lastVisible), limit(BATCH_SIZE + 1));
            }

            const snap = await getDocs(q);
            const videos = [];

            snap.forEach(doc => {
                videos.push({ docId: doc.id, ...doc.data() });
            });

            videos.sort(() => Math.random() - 0.5);

            if (videos.length > BATCH_SIZE) {
                lastVisible = snap.docs[snap.docs.length - 2];
                videos.pop();
            } else {
                hasMore = false;
            }

            if (videos.length === 0) {
                hasMore = false;
            } else {
                const grid = document.getElementById('grid');
                videos.forEach(v => {
                    const tid = `thumb-${v.docId}`;
                    grid.innerHTML += `
                        <a href="watch.html?id=${v.docId}" class="v-card">
                            <div class="thumb-container">
                                <img src="" id="${tid}" class="thumb">
                            </div>
                            <div class="v-title">${v.title}</div>
                            <div class="v-stats">${(v.views || 0).toLocaleString()}回視聴</div>
                        </a>
                    `;
                    setTimeout(() => {
                        const img = document.getElementById(tid);
                        if (v.thumbnail) {
                            img.src = v.thumbnail;
                            img.classList.add('loaded');
                        } else {
                            generateThumb(v.url, img);
                        }
                    }, 100);
                });
            }
        } catch (error) {
            console.error("Error loading videos:", error);
            hasMore = false;
        } finally {
            isLoading = false;
            document.getElementById('loadingIndicator').style.display = 'none';
        }
    }

    function generateThumb(url, imgElement) {
        const v = document.createElement('video');
        v.src = url;
        v.preload = "metadata";
        v.muted = true;
        v.crossOrigin = "anonymous";
        v.playsInline = true;
        v.onloadedmetadata = () => { v.currentTime = 1.0; };
        v.onseeked = () => {
            const c = document.createElement('canvas');
            c.width = 320;
            c.height = 180;
            c.getContext('2d').drawImage(v, 0, 0, 320, 180);
            imgElement.src = c.toDataURL('image/jpeg', 0.8);
            imgElement.classList.add('loaded');
            v.removeAttribute('src');
            v.load();
            v.remove();
        };
        v.onerror = () => { v.remove(); };
    }
</script>
</body>
</html>
