<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>再生 - GINGA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-dark: #0a0e27;
            --bg-darker: #050810;
            --bg-card: #1a1f3a;
            --cyan: #00d9ff;
            --cyan-light: #4df4ff;
            --cyan-dark: #0099cc;
            --text-primary: #e0e0ff;
            --text-secondary: #a0a0c0;
            --border: #2a3050;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--bg-darker) 0%, var(--bg-dark) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        header {
            width: 100%;
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            background: rgba(5, 8, 16, 0.9);
            backdrop-filter: blur(10px);
        }
        
        .logo {
            font-size: 20px;
            font-weight: 900;
            text-decoration: none;
            background: linear-gradient(135deg, var(--cyan) 0%, var(--cyan-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .container {
            display: flex;
            max-width: 1400px;
            width: 100%;
            gap: 20px;
            padding: 20px;
            box-sizing: border-box;
        }
        
        .main-col {
            flex: 2;
            min-width: 0;
        }
        
        .side-col {
            flex: 1;
            min-width: 0;
        }
        
        video {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 10px;
            border: 1px solid var(--border);
        }
        
        .v-title {
            font-size: 18px;
            font-weight: 700;
            margin: 15px 0 10px;
            color: var(--text-primary);
            line-height: 1.3;
        }
        
        .stat-row {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }
        
        .action-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            padding: 12px 0;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 7px 14px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: rgba(0, 217, 255, 0.1);
            color: var(--cyan);
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: all 0.3s ease;
            white-space: nowrap;
            flex-shrink: 0;
        }
        
        .btn:hover {
            background: rgba(0, 217, 255, 0.2);
            border-color: var(--cyan);
        }
        
        .btn.active {
            background: var(--cyan);
            color: var(--bg-dark);
            border-color: var(--cyan);
        }
        
        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .admin-del {
            background: rgba(255, 100, 100, 0.15);
            color: #ff6464;
            border-color: rgba(255, 100, 100, 0.3);
            display: none;
        }
        
        .admin-del:hover {
            background: rgba(255, 100, 100, 0.25);
        }
        
        .edit-num {
            cursor: pointer;
            border-bottom: 1px dotted var(--cyan);
            transition: color 0.2s;
        }
        
        .edit-num:hover {
            color: var(--cyan-light);
        }

        .comment-section {
            margin-top: 30px;
            border-top: 1px solid var(--border);
            padding-top: 20px;
        }
        
        #commentHeader {
            font-size: 16px;
            color: var(--text-primary);
            margin-bottom: 15px;
        }
        
        .comment-input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            background: rgba(0, 217, 255, 0.05);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 13px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }
        
        .comment-input:focus {
            outline: none;
            border-color: var(--cyan);
            box-shadow: 0 0 10px rgba(0, 217, 255, 0.2);
        }
        
        .comment-item {
            margin-bottom: 20px;
            font-size: 13px;
            background: rgba(26, 31, 58, 0.3);
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }
        
        .comment-main {
            display: flex;
            gap: 6px;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }
        
        .comment-main strong {
            color: var(--cyan);
        }
        
        .admin-badge {
            color: #ff9999;
            font-weight: 700;
            font-size: 10px;
            margin-left: 4px;
        }
        
        .reply-btn {
            font-size: 11px;
            color: var(--text-secondary);
            cursor: pointer;
            background: none;
            border: none;
            padding: 4px;
            margin-top: 4px;
            transition: color 0.2s;
        }
        
        .reply-btn:hover {
            color: var(--cyan);
        }
        
        .reply-list {
            margin-left: 15px;
            margin-top: 8px;
            border-left: 2px solid var(--border);
            padding-left: 12px;
        }
        
        .reply-list > div {
            margin-bottom: 6px;
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.3;
        }
        
        .reply-list strong {
            color: var(--cyan-light);
        }
        
        .reply-input-area {
            margin-left: 15px;
            display: none;
            margin-top: 8px;
        }
        
        .reply-input-area input {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border);
            background: rgba(0, 217, 255, 0.05);
            border-radius: 4px;
            color: var(--text-primary);
            font-size: 12px;
        }
        
        .reply-input-area input:focus {
            outline: none;
            border-color: var(--cyan);
        }
        
        .related-title {
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-primary);
            font-size: 14px;
        }
        
        .rec-card {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            cursor: pointer;
            text-decoration: none;
            color: var(--text-primary);
            transition: transform 0.2s;
            border-radius: 6px;
            padding: 6px;
        }
        
        .rec-card:hover {
            transform: translateX(4px);
            background: rgba(0, 217, 255, 0.05);
        }
        
        .rec-thumb {
            width: 100px;
            height: 56px;
            background: rgba(0, 217, 255, 0.1);
            border-radius: 4px;
            flex-shrink: 0;
            object-fit: cover;
        }
        
        .rec-text {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
        }
        
        .rec-text h4 {
            font-size: 12px;
            margin: 0 0 3px 0;
            line-height: 1.3;
            color: var(--text-primary);
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        
        .rec-text p {
            font-size: 10px;
            color: var(--text-secondary);
            margin: 0;
        }

        .playlist-controls {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .playlist-nav-btn {
            flex: 1;
            padding: 8px;
            background: rgba(0, 217, 255, 0.1);
            border: 1px solid var(--border);
            color: var(--cyan);
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .playlist-nav-btn:hover {
            background: rgba(0, 217, 255, 0.2);
        }

        .playlist-nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        @media (max-width: 1024px) {
            .container {
                flex-direction: column;
                gap: 15px;
                padding: 15px;
            }
            
            .main-col, .side-col {
                flex: 1;
            }
        }
        
        @media (max-width: 768px) {
            header {
                padding: 10px 15px;
            }
            
            .logo {
                font-size: 18px;
            }
            
            .v-title {
                font-size: 16px;
                margin: 12px 0 8px;
            }
            
            .stat-row {
                font-size: 11px;
                margin-bottom: 10px;
            }
            
            .btn {
                padding: 6px 12px;
                font-size: 11px;
            }
            
            .comment-input {
                padding: 8px;
                font-size: 12px;
                margin-bottom: 12px;
            }
            
            #commentHeader {
                font-size: 14px;
                margin-bottom: 12px;
            }
            
            .comment-item {
                padding: 10px;
                margin-bottom: 15px;
                font-size: 12px;
            }
        }
        
        @media (max-width: 480px) {
            header {
                padding: 8px 12px;
            }
            
            .logo {
                font-size: 16px;
            }
            
            .container {
                gap: 12px;
                padding: 10px;
            }
            
            .v-title {
                font-size: 14px;
                margin: 10px 0 6px;
            }
            
            .stat-row {
                font-size: 11px;
                margin-bottom: 10px;
            }
            
            .action-bar {
                gap: 6px;
                padding: 8px 0;
            }
            
            .btn {
                padding: 5px 10px;
                font-size: 10px;
            }
            
            .btn-group {
                width: 100%;
            }
            
            .comment-section {
                margin-top: 20px;
                padding-top: 15px;
            }
            
            .comment-input {
                padding: 8px;
                font-size: 12px;
                margin-bottom: 10px;
            }
            
            #commentHeader {
                font-size: 13px;
                margin-bottom: 10px;
            }
            
            .comment-item {
                padding: 8px;
                margin-bottom: 12px;
                font-size: 11px;
            }
            
            .rec-thumb {
                width: 80px;
                height: 45px;
            }
            
            .rec-text h4 {
                font-size: 11px;
            }
            
            .rec-text p {
                font-size: 9px;
            }

            .playlist-controls {
                gap: 6px;
                margin-top: 8px;
            }

            .playlist-nav-btn {
                padding: 6px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

<header><a href="index.html" class="logo">◆ GINGA</a></header>

<div class="container">
    <div class="main-col">
        <video id="player" controls autoplay></video>
        <div id="vTitle" class="v-title">読み込み中...</div>
        <div class="stat-row">
            再生回数 <span id="viewNum" class="edit-num">0</span>回
        </div>
        <div class="action-bar">
            <div class="btn-group">
                <button class="btn" id="likeBtn">👍 <span id="likeNum" class="edit-num">0</span></button>
                <button id="adminDelBtn" class="btn admin-del">削除</button>
            </div>
        </div>

        <div class="playlist-controls" id="playlistControls" style="display: none;">
            <button class="playlist-nav-btn" id="prevBtn">⬅ 前へ</button>
            <button class="playlist-nav-btn" id="nextBtn">次へ ➡</button>
        </div>

        <div class="comment-section">
            <h3 id="commentHeader">コメント 0件</h3>
            <input type="text" id="commentInput" class="comment-input" placeholder="💭 コメントを追加...">
            <div id="commentList"></div>
        </div>
    </div>
    <div class="side-col">
        <div class="related-title">おすすめ</div>
        <div id="relatedList"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc, getDocs, collection, query, limit, updateDoc, increment, addDoc, serverTimestamp, onSnapshot, deleteDoc, setDoc, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAZivYKOGc1tSUAIDq_c10C1wJ-Pdh0U2o",
        authDomain: "mytube-f4544.firebaseapp.com",
        projectId: "mytube-f4544",
        storageBucket: "mytube-f4544.firebasestorage.app",
        messagingSenderId: "655444283107",
        appId: "1:655444283107:web:04f9173faf2d951790ffd6"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const params = new URLSearchParams(window.location.search);
    const vid = params.get("id");
    const playlistParam = params.get("playlist");
    const ADMIN_UID = "tP5CqCTRO3f2QQ8jdoj0ftY8kZU2";
    
    let playlist = [];
    let currentIndex = -1;

    // プレイリストの初期化
    if (playlistParam) {
        try {
            playlist = JSON.parse(playlistParam);
            currentIndex = playlist.indexOf(vid);
            if (currentIndex !== -1) {
                updatePlaylistUI();
            }
        } catch (e) {
            console.log('Playlist parsing error:', e);
        }
    }

    function updatePlaylistUI() {
        const controls = document.getElementById('playlistControls');
        controls.style.display = playlist.length > 1 ? 'flex' : 'none';
        
        document.getElementById('prevBtn').disabled = currentIndex <= 0;
        document.getElementById('nextBtn').disabled = currentIndex >= playlist.length - 1;
    }

    document.getElementById('prevBtn').onclick = () => {
        if (currentIndex > 0) {
            currentIndex--;
            window.location.href = `watch.html?id=${playlist[currentIndex]}&playlist=${JSON.stringify(playlist)}`;
        }
    };

    document.getElementById('nextBtn').onclick = () => {
        if (currentIndex < playlist.length - 1) {
            currentIndex++;
            window.location.href = `watch.html?id=${playlist[currentIndex]}&playlist=${JSON.stringify(playlist)}`;
        }
    };

    if (vid) load();

    async function load() {
        const vRef = doc(db, "videos", vid);
        const vSnap = await getDoc(vRef);
        const v = vSnap.data();
        document.getElementById('player').src = v.url;
        document.getElementById('vTitle').innerText = v.title;
        document.getElementById('viewNum').innerText = (v.views || 0).toLocaleString();
        document.getElementById('likeNum').innerText = (v.likes || 0).toLocaleString();

        document.getElementById('likeBtn').onclick = async () => {
            const btn = document.getElementById('likeBtn');
            const anonymousId = getAnonymousId();
            const ref = doc(db, "videos", vid, "likedUsers", anonymousId);
            const likeSnap = await getDoc(ref);
            const isLiked = likeSnap.exists();
            
            await (isLiked ? deleteDoc(ref) : setDoc(ref, { u: 1 }));
            await updateDoc(vRef, { likes: increment(isLiked ? -1 : 1) });
            btn.classList.toggle('active');
            const fresh = await getDoc(vRef);
            document.getElementById('likeNum').innerText = (fresh.data().likes || 0).toLocaleString();
        };

        const cCol = collection(db, "videos", vid, "comments");
        onSnapshot(query(cCol, orderBy("createdAt", "desc")), snap => {
            document.getElementById('commentHeader').innerText = `コメント ${snap.size}件`;
            const list = document.getElementById('commentList');
            list.innerHTML = "";
            snap.forEach(d => {
                const c = d.data();
                const cid = d.id;
                const adminTag = (c.userId === ADMIN_UID) ? '<span class="admin-badge">[運営]</span>' : '';
                
                const div = document.createElement('div');
                div.className = "comment-item";
                div.innerHTML = `
                    <div class="comment-main">
                        <strong>${c.userName || '匿名'}${adminTag}</strong>: ${c.text}
                    </div>
                    <button class="reply-btn" onclick="toggleReply('${cid}')">返信</button>
                    <div id="reply-area-${cid}" class="reply-input-area">
                        <input type="text" id="input-${cid}" class="comment-input" placeholder="返信を書く...">
                    </div>
                    <div id="replies-${cid}" class="reply-list"></div>
                `;
                list.appendChild(div);

                onSnapshot(query(collection(db, "videos", vid, "comments", cid, "replies"), orderBy("createdAt", "asc")), rSnap => {
                    const rList = document.getElementById(`replies-${cid}`);
                    rList.innerHTML = "";
                    rSnap.forEach(rd => {
                        const r = rd.data();
                        const rAdminTag = (r.userId === ADMIN_UID) ? '<span class="admin-badge">[運営]</span>' : '';
                        rList.innerHTML += `<div><strong>${r.userName}${rAdminTag}</strong>: ${r.text}</div>`;
                    });
                });

                document.getElementById(`input-${cid}`).onkeypress = async (e) => {
                    if (e.key === 'Enter' && e.target.value.trim()) {
                        const anonymousId = getAnonymousId();
                        await addDoc(collection(db, "videos", vid, "comments", cid, "replies"), {
                            text: e.target.value,
                            userName: "ゲスト",
                            userId: anonymousId,
                            createdAt: serverTimestamp()
                        });
                        e.target.value = "";
                        toggleReply(cid);
                    }
                };
            });
        });

        document.getElementById('commentInput').onkeypress = async (e) => {
            if (e.key === 'Enter' && e.target.value.trim()) {
                const anonymousId = getAnonymousId();
                await addDoc(cCol, {
                    text: e.target.value,
                    userName: "ゲスト",
                    userId: anonymousId,
                    createdAt: serverTimestamp()
                });
                e.target.value = "";
            }
        };

        updateDoc(vRef, { views: increment(1) });

        const relatedSnap = await getDocs(query(collection(db, "videos"), limit(12)));
        const videos = [];
        relatedSnap.forEach(doc => {
            if (doc.id !== vid) {
                videos.push({ docId: doc.id, ...doc.data() });
            }
        });
        
        videos.sort(() => Math.random() - 0.5);
        
        const relatedList = document.getElementById('relatedList');
        relatedList.innerHTML = "";
        videos.slice(0, 8).forEach(data => {
            const a = document.createElement('a');
            a.href = `watch.html?id=${data.docId}`;
            a.className = "rec-card";
            a.innerHTML = `
                <img src="${data.thumbnail || ''}" class="rec-thumb">
                <div class="rec-text">
                    <h4>${data.title}</h4>
                    <p>${(data.views || 0).toLocaleString()}回視聴</p>
                </div>
            `;
            relatedList.appendChild(a);
        });
    }

    window.toggleReply = (cid) => {
        const area = document.getElementById(`reply-area-${cid}`);
        area.style.display = area.style.display === "block" ? "none" : "block";
    };

    function getAnonymousId() {
        let id = localStorage.getItem('gingaAnonymousId');
        if (!id) {
            id = 'anon_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('gingaAnonymousId', id);
        }
        return id;
    }

    function setupAdmin() {
        document.getElementById('adminDelBtn').style.display = "inline-block";
        document.querySelectorAll('.edit-num').forEach(el => {
            el.onclick = async (e) => {
                e.stopPropagation();
                const val = prompt("数値を変更:", el.innerText.replace(/,/g, ''));
                if (val !== null && !isNaN(val)) {
                    const ref = doc(db, "videos", vid);
                    const key = el.id === "viewNum" ? "views" : "likes";
                    await updateDoc(ref, { [key]: parseInt(val) });
                    el.innerText = parseInt(val).toLocaleString();
                }
            };
        });
        document.getElementById('adminDelBtn').onclick = async () => {
            if (confirm("この動画を削除してもよろしいですか？")) {
                await deleteDoc(doc(db, "videos", vid));
                location.href = "index.html";
            }
        };
    }

    const adminKey = localStorage.getItem('gingaAdminKey');
    if (adminKey === 'admin_secret_key') {
        setupAdmin();
    }
</script>
</body>
</html>
