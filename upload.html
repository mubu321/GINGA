<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>動画投稿 - GINGA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-dark: #0a0e27;
            --bg-darker: #050810;
            --bg-card: #1a1f3a;
            --cyan: #00d9ff;
            --cyan-light: #4df4ff;
            --text-primary: #e0e0ff;
            --text-secondary: #a0a0c0;
            --border: #2a3050;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--bg-darker) 0%, var(--bg-dark) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 30px 20px;
        }
        
        .header-logo {
            font-size: 28px;
            font-weight: 900;
            text-decoration: none;
            background: linear-gradient(135deg, var(--cyan) 0%, var(--cyan-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 40px;
            letter-spacing: -2px;
        }
        
        .header-logo::before {
            content: "◆";
            font-size: 24px;
            color: var(--cyan);
        }
        
        .upload-card {
            max-width: 500px;
            margin: 0 auto;
            border: 1px solid var(--border);
            padding: 40px;
            border-radius: 12px;
            background: rgba(26, 31, 58, 0.5);
            backdrop-filter: blur(10px);
        }
        
        .upload-card h2 {
            margin-bottom: 30px;
            color: var(--cyan-light);
            font-size: 24px;
        }
        
        input[type="text"],
        input[type="file"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid var(--border);
            background: rgba(0, 217, 255, 0.05);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        
        input[type="text"]:focus,
        input[type="file"]:focus {
            outline: none;
            border-color: var(--cyan);
            box-shadow: 0 0 10px rgba(0, 217, 255, 0.2);
        }
        
        input[type="file"]::file-selector-button {
            background: rgba(0, 217, 255, 0.15);
            color: var(--cyan);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        input[type="file"]::file-selector-button:hover {
            background: rgba(0, 217, 255, 0.25);
            border-color: var(--cyan);
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            margin-top: 5px;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--cyan) 0%, var(--cyan-light) 100%);
            color: var(--bg-dark);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 15px;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 217, 255, 0.4);
        }
        
        button:disabled {
            background: var(--text-secondary);
            cursor: not-allowed;
            transform: none;
            opacity: 0.6;
        }

        #progressContainer {
            display: none;
            margin-top: 25px;
            text-align: center;
        }
        
        .progress-bg {
            background: rgba(0, 217, 255, 0.1);
            border-radius: 10px;
            height: 8px;
            width: 100%;
            overflow: hidden;
            margin-top: 10px;
            border: 1px solid var(--border);
        }
        
        .progress-bar {
            background: linear-gradient(90deg, var(--cyan) 0%, var(--cyan-light) 100%);
            height: 100%;
            width: 0%;
            transition: width 0.2s;
        }
        
        #statusText {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        @media (max-width: 480px) {
            body {
                padding: 20px 15px;
            }

            .upload-card {
                padding: 25px 20px;
            }

            .upload-card h2 {
                font-size: 20px;
                margin-bottom: 20px;
            }

            input[type="text"],
            input[type="file"] {
                padding: 10px;
                margin-bottom: 12px;
                font-size: 13px;
            }

            button {
                padding: 10px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

<a href="index.html" class="header-logo">GINGA</a>

<div class="upload-card">
    <h2>🎬 動画をアップロード</h2>
    <input type="text" id="title" placeholder="動画のタイトルを入力">
    <label>動画ファイルを選択:</label>
    <input type="file" id="videoFile" accept="video/*">
    
    <button id="uploadBtn">投稿する</button>

    <div id="progressContainer">
        <div id="statusText">準備中... 0%</div>
        <div class="progress-bg">
            <div id="progressBar" class="progress-bar"></div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const CLOUD_NAME = "du5blunb0";
    const UPLOAD_PRESET = "mytube_preset";

    const firebaseConfig = {
        apiKey: "AIzaSyAZivYKOGc1tSUAIDq_c10C1wJ-Pdh0U2o",
        authDomain: "mytube-f4544.firebaseapp.com",
        projectId: "mytube-f4544",
        storageBucket: "mytube-f4544.firebasestorage.app",
        messagingSenderId: "655444283107",
        appId: "1:655444283107:web:04f9173faf2d951790ffd6"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById('uploadBtn').onclick = async () => {
        const title = document.getElementById('title').value;
        const file = document.getElementById('videoFile').files[0];
        
        if (!title || !file) return alert("タイトルと動画ファイルを選択してください");

        const btn = document.getElementById('uploadBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const statusText = document.getElementById('statusText');

        btn.disabled = true;
        progressContainer.style.display = 'block';

        const url = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`;
        const xhr = new XMLHttpRequest();
        const formData = new FormData();

        formData.append('file', file);
        formData.append('upload_preset', UPLOAD_PRESET);

        xhr.open('POST', url, true);

        xhr.upload.onprogress = (e) => {
            if (e.lengthComputable) {
                const progress = Math.round((e.loaded / e.total) * 100);
                progressBar.style.width = progress + '%';
                statusText.innerText = `アップロード中... ${progress}%`;
            }
        };

        xhr.onload = async () => {
            if (xhr.status === 200) {
                const response = JSON.parse(xhr.responseText);
                const videoUrl = response.secure_url;
                const thumbUrl = videoUrl.substring(0, videoUrl.lastIndexOf(".")) + ".jpg";

                try {
                    await addDoc(collection(db, "videos"), {
                        title: title,
                        url: videoUrl,
                        thumbnail: thumbUrl,
                        userId: "anonymous",
                        views: 0,
                        likes: 0,
                        createdAt: serverTimestamp()
                    });
                    statusText.innerText = "✓ 投稿完了！";
                    setTimeout(() => {
                        location.href = "index.html";
                    }, 1000);
                } catch (e) {
                    console.error(e);
                    alert("ファイアベースへの保存に失敗しました");
                    btn.disabled = false;
                }
            } else {
                const err = JSON.parse(xhr.responseText);
                alert("アップロードに失敗しました: " + (err.error?.message || "不明なエラー"));
                btn.disabled = false;
            }
        };

        xhr.onerror = () => {
            alert("ネットワークエラーが発生しました");
            btn.disabled = false;
        };

        xhr.send(formData);
    };
</script>
</body>
</html>
