<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GINGA - ログイン</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-dark: #0a0e27;
            --bg-darker: #050810;
            --bg-card: #1a1f3a;
            --cyan: #00d9ff;
            --cyan-light: #4df4ff;
            --text-primary: #e0e0ff;
            --text-secondary: #a0a0c0;
            --border: #2a3050;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-darker) 0%, var(--bg-dark) 100%);
            color: var(--text-primary);
            padding: 20px;
        }
        
        .login-box {
            text-align: center;
            padding: 40px 30px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: rgba(26, 31, 58, 0.5);
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 380px;
        }
        
        .logo {
            font-size: 44px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--cyan) 0%, var(--cyan-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 25px;
            display: block;
            letter-spacing: -2px;
        }
        
        .logo::before {
            content: "◆ ";
            color: var(--cyan);
        }
        
        .subtitle {
            color: var(--text-secondary);
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        
        .login-btn {
            background: linear-gradient(135deg, var(--cyan) 0%, var(--cyan-light) 100%);
            color: var(--bg-dark);
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            width: 100%;
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 217, 255, 0.4);
        }
        
        .status {
            margin-top: 18px;
            font-size: 12px;
            color: var(--text-secondary);
            min-height: 18px;
        }
        
        .status.error {
            color: #ff9999;
        }
        
        .status.success {
            color: var(--cyan);
        }
        
        @media (max-width: 480px) {
            .login-box {
                padding: 30px 20px;
            }
            
            .logo {
                font-size: 36px;
                margin-bottom: 20px;
            }
            
            .subtitle {
                font-size: 12px;
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>

<div class="login-box">
    <span class="logo">GINGA</span>
    <p class="subtitle">高品質な動画配信プラットフォーム<br>Googleアカウントでログインして始めましょう</p>
    <button class="login-btn" id="googleLoginBtn">🔐 Googleでログイン</button>
    <div id="statusMsg" class="status"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAZivYKOGc1tSUAIDq_c10C1wJ-Pdh0U2o",
        authDomain: "mytube-f4544.firebaseapp.com",
        projectId: "mytube-f4544",
        storageBucket: "mytube-f4544.firebasestorage.app",
        messagingSenderId: "655444283107",
        appId: "1:655444283107:web:04f9173faf2d951790ffd6"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    document.getElementById('googleLoginBtn').onclick = async () => {
        const msg = document.getElementById('statusMsg');
        msg.innerText = "認証ウィンドウを開いています...";
        msg.classList.remove('error', 'success');

        try {
            const result = await signInWithPopup(auth, provider);
            const user = result.user;
            
            msg.innerText = "ユーザー情報を確認中...";

            const uRef = doc(db, "users", user.uid);
            const uSnap = await getDoc(uRef);
            
            if (!uSnap.exists()) {
                await setDoc(uRef, {
                    name: user.displayName || "ユーザー",
                    icon: user.photoURL || "",
                    followers: 0,
                    email: user.email
                });
            }

            msg.innerText = "ログイン成功！";
            msg.classList.add('success');
            setTimeout(() => {
                location.href = 'index.html';
            }, 800);

        } catch (error) {
            console.error("Login Error:", error);
            msg.classList.add('error');
            
            if (error.code === 'auth/popup-blocked') {
                msg.innerText = "ポップアップがブロックされました。ブラウザの設定で許可してください。";
            } else if (error.code === 'auth/cancelled-by-user') {
                msg.innerText = "ログインがキャンセルされました。";
            } else {
                msg.innerText = "ログイン失敗: " + error.message;
            }
        }
    };
</script>
</body>
</html>
