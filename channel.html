<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>チャンネル - GINGA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-dark: #0a0e27;
            --bg-darker: #050810;
            --bg-card: #1a1f3a;
            --cyan: #00d9ff;
            --cyan-light: #4df4ff;
            --text-primary: #e0e0ff;
            --text-secondary: #a0a0c0;
            --border: #2a3050;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--bg-darker) 0%, var(--bg-dark) 100%);
            color: var(--text-primary);
            min-height: 100vh;
        }
        
        header {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            background: rgba(5, 8, 16, 0.9);
            backdrop-filter: blur(10px);
        }
        
        .logo {
            font-size: 20px;
            font-weight: 900;
            text-decoration: none;
            background: linear-gradient(135deg, var(--cyan) 0%, var(--cyan-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .channel-header {
            padding: 30px 20px;
            border-bottom: 1px solid var(--border);
            text-align: center;
        }
        
        .c-icon {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            background: rgba(0, 217, 255, 0.1);
            border: 3px solid var(--cyan);
            margin-bottom: 15px;
        }
        
        .c-name {
            font-size: 22px;
            font-weight: 700;
            margin: 10px 0 15px;
            color: var(--text-primary);
        }
        
        .follow-btn {
            background: linear-gradient(135deg, var(--cyan) 0%, var(--cyan-light) 100%);
            color: var(--bg-dark);
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .follow-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 217, 255, 0.4);
        }
        
        .follow-btn.following {
            background: rgba(0, 217, 255, 0.1);
            color: var(--cyan);
            border: 1px solid var(--border);
        }
        
        .videos-title {
            font-size: 18px;
            font-weight: 700;
            padding: 20px 20px 10px;
            color: var(--text-primary);
        }
        
        .v-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            padding: 0 20px 20px;
        }
        
        .v-card {
            text-decoration: none;
            color: var(--text-primary);
            font-size: 13px;
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .v-card:hover {
            transform: translateY(-5px);
        }
        
        .thumb {
            width: 100%;
            aspect-ratio: 16/9;
            background: rgba(0, 217, 255, 0.1);
            border-radius: 8px;
            object-fit: cover;
            display: block;
        }
        
        .v-title {
            font-weight: 700;
            margin-top: 10px;
            font-size: 14px;
            line-height: 1.3;
            color: var(--text-primary);
        }
        
        @media (max-width: 1024px) {
            .v-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 12px;
                padding: 0 15px 15px;
            }
        }
        
        @media (max-width: 768px) {
            header {
                padding: 10px 15px;
            }
            
            .logo {
                font-size: 18px;
            }
            
            .channel-header {
                padding: 20px 15px;
            }
            
            .c-icon {
                width: 80px;
                height: 80px;
                margin-bottom: 12px;
            }
            
            .c-name {
                font-size: 18px;
                margin: 8px 0 12px;
            }
            
            .follow-btn {
                padding: 8px 16px;
                font-size: 13px;
            }
            
            .videos-title {
                font-size: 16px;
                padding: 15px 15px 8px;
            }
            
            .v-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 10px;
                padding: 0 12px 12px;
            }
        }
        
        @media (max-width: 480px) {
            header {
                padding: 8px 12px;
            }
            
            .logo {
                font-size: 16
