<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>チャンネル - GINGA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-dark: #0a0e27;
            --bg-darker: #050810;
            --bg-card: #1a1f3a;
            --cyan: #00d9ff;
            --cyan-light: #4df4ff;
            --text-primary: #e0e0ff;
            --text-secondary: #a0a0c0;
            --border: #2a3050;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--bg-darker) 0%, var(--bg-dark) 100%);
            color: var(--text-primary);
            min-height: 100vh;
        }
        
        header {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            background: rgba(5, 8, 16, 0.9);
            backdrop-filter: blur(10px);
        }
        
        .logo {
            font-size: 20px;
            font-weight: 900;
            text-decoration: none;
            background: linear-gradient(135deg, var(--cyan) 0%, var(--cyan-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .channel-header {
            padding: 30px 20px;
            border-bottom: 1px solid var(--border);
            text-align: center;
        }
        
        .c-icon {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            background: rgba(0, 217, 255, 0.1);
            border: 3px solid var(--cyan);
            margin-bottom: 15px;
        }
        
        .c-name {
            font-size: 22px;
            font-weight: 700;
            margin: 10px 0;
            color: var(--text-primary);
        }
        
        .videos-title {
            font-size: 18px;
            font-weight: 700;
            padding: 20px 20px 10px;
            color: var(--text-primary);
        }
        
        .v-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            padding: 0 20px 20px;
        }
        
        .v-card {
            text-decoration: none;
            color: var(--text-primary);
            font-size: 13px;
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .v-card:hover {
            transform: translateY(-5px);
        }
        
        .thumb {
            width: 100%;
            aspect-ratio: 16/9;
            background: rgba(0, 217, 255, 0.1);
            border-radius: 8px;
            object-fit: cover;
            display: block;
        }
        
        .v-title {
            font-weight: 700;
            margin-top: 10px;
            font-size: 14px;
            line-height: 1.3;
            color: var(--text-primary);
        }
        
        @media (max-width: 1024px) {
            .v-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 12px;
                padding: 0 15px 15px;
            }
        }
        
        @media (max-width: 768px) {
            header {
                padding: 10px 15px;
            }
            
            .logo {
                font-size: 18px;
            }
            
            .channel-header {
                padding: 20px 15px;
            }
            
            .c-icon {
                width: 80px;
                height: 80px;
                margin-bottom: 12px;
            }
            
            .c-name {
                font-size: 18px;
                margin: 8px 0;
            }
            
            .videos-title {
                font-size: 16px;
                padding: 15px 15px 8px;
            }
            
            .v-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 10px;
                padding: 0 12px 12px;
            }
        }
        
        @media (max-width: 480px) {
            header {
                padding: 8px 12px;
            }
            
            .logo {
                font-size: 16px;
            }
            
            .channel-header {
                padding: 15px 12px;
            }
            
            .c-icon {
                width: 60px;
                height: 60px;
                margin-bottom: 10px;
            }
            
            .c-name {
                font-size: 16px;
                margin: 6px 0;
            }
            
            .videos-title {
                font-size: 14px;
                padding: 12px 12px 6px;
            }
            
            .v-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
                padding: 0 8px 8px;
            }
            
            .v-title {
                font-size: 12px;
                margin-top: 8px;
            }
        }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="logo">◆ GINGA</a>
</header>

<div class="channel-header">
    <img id="chIcon" class="c-icon" src="">
    <div id="chName" class="c-name">読み込み中...</div>
</div>

<h3 class="videos-title">投稿動画</h3>
<div class="v-grid" id="vGrid"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAZivYKOGc1tSUAIDq_c10C1wJ-Pdh0U2o",
        authDomain: "mytube-f4544.firebaseapp.com",
        projectId: "mytube-f4544",
        storageBucket: "mytube-f4544.firebasestorage.app",
        messagingSenderId: "655444283107",
        appId: "1:655444283107:web:04f9173faf2d951790ffd6"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const params = new URLSearchParams(window.location.search);
    const targetUid = params.get("id");

    if (targetUid) {
        getDoc(doc(db, "users", targetUid)).then(uSnap => {
            if (uSnap.exists()) {
                const ud = uSnap.data();
                document.getElementById('chName').innerText = ud.name;
                document.getElementById('chIcon').src = ud.icon || "";
            }
        });

        const q = query(collection(db, "videos"), where("userId", "==", targetUid));
        getDocs(q).then(snap => {
            const videos = [];
            snap.forEach(doc => videos.push({docId: doc.id, ...doc.data()}));
            
            // ランダムシャッフル
            videos.sort(() => Math.random() - 0.5);
            
            const grid = document.getElementById('vGrid');
            grid.innerHTML = "";
            videos.forEach(v => {
                grid.innerHTML += `
                    <a href="watch.html?id=${v.docId}" class="v-card">
                        <img class="thumb" src="${v.thumbnail || ''}">
                        <div class="v-title">${v.title}</div>
                    </a>`;
            });
        });
    }
</script>
</body>
</html>
